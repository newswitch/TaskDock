[package]
name = "taskdock"
version = "0.1.0"
description = "TaskDock · 事项坞 — 桌面右上角未解决事项跟踪器"
authors = ["TaskDock"]
edition = "2021"

[lib]
name = "taskdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
